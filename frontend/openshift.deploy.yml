---
# Frontend deploy Template — consumed by `oc process` in reusable-deploy.yml.
#
# VITE_* values are injected into /srv/config.js by docker-entrypoint.sh at
# container start (runtime config). The Vite-built bundle is env-agnostic;
# the same image binary serves DEV preview, TEST, and PROD.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-frep-frontend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-frep
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  # NOTE: SLOT and DOMAIN used to live here, but they only ever fed the Route
  # hostname. The Route moved to openshift.route.yml / openshift.vanity-route.yml,
  # so both parameters moved with it — don't re-add them here.
  - name: IMAGE_TAG
    description: Container image tag (PR number, 'test', or 'prod')
    value: latest
  - name: REGISTRY
    description: Image registry path (no tag)
    value: ghcr.io/bcgov/nr-frep/frontend
  - name: REPLICAS
    description: |
      Frontend pod count. "2" preserves the value that was hardcoded here
      before parameterization; reusable-deploy.yml raises it for PROD.
    value: "2"
  - name: FRONTEND_LOG_LEVEL
    value: INFO
  # Runtime VITE_* config (rendered into /srv/config.js by the entrypoint).
  - name: VITE_USER_POOLS_ID
    required: true
  - name: VITE_USER_POOLS_WEB_CLIENT_ID
    required: true
  # Federated logout chain (Siteminder → Keycloak → Cognito → app). Optional:
  # if any is blank, logout falls back to Amplify's plain sign-out. TEST hosts
  # use logontest7 / test.loginproxy; PROD drops the "test"/"7".
  - name: VITE_LOGOUT_SITEMINDER_URL
    description: Siteminder logoff.cgi (e.g. https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi)
  - name: VITE_LOGOUT_KEYCLOAK_URL
    description: Keycloak end-session URL (<loginproxy-host>/auth/realms/standard/protocol/openid-connect/logout)
  - name: VITE_LOGOUT_KEYCLOAK_CLIENT_ID
    description: FAM Keycloak client id for FREP
  - name: VITE_BACKEND_URL
    description: Browser-facing API base path; usually '/api'
    value: /api
  - name: VITE_APP_NAME
    value: FREP IMS
  # VITE_ZONE = the deploy zone. AuthProvider uppercases this to pick the
  # Cognito identity provider (e.g. ZONE=42 → identity_provider=42-IDIR,
  # which won't exist; map PR ZONEs to 'dev' below in reusable-deploy.yml).
  - name: VITE_ZONE
    value: dev

objects:
  # ── Deployment ────────────────────────────────────────────
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/name: ${NAME}-frontend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      # ${{...}} (not ${...}) so the value is emitted as a JSON number —
      # replicas must not be a quoted string.
      replicas: ${{REPLICAS}}
      selector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-frontend-${ZONE}
            app.kubernetes.io/instance: ${ZONE}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          initContainers:
            - name: seed-srv
              image: ${REGISTRY}:${IMAGE_TAG}
              command:
                - sh
                - -c
                - 'cp -r /srv/. /srv-rw/'
              volumeMounts:
                - name: srv
                  mountPath: /srv-rw
              resources:
                requests:
                  cpu: "20m"
                  memory: "32Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: ${NAME}-frontend
              image: ${REGISTRY}:${IMAGE_TAG}
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: ${FRONTEND_LOG_LEVEL}
                # Caddy reverse-proxies /api* to the same-zone backend Service.
                - name: BACKEND_URL
                  value: http://${NAME}-backend-${ZONE}:8080
                - name: XDG_DATA_HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: VITE_USER_POOLS_ID
                  value: ${VITE_USER_POOLS_ID}
                - name: VITE_USER_POOLS_WEB_CLIENT_ID
                  value: ${VITE_USER_POOLS_WEB_CLIENT_ID}
                - name: VITE_LOGOUT_SITEMINDER_URL
                  value: ${VITE_LOGOUT_SITEMINDER_URL}
                - name: VITE_LOGOUT_KEYCLOAK_URL
                  value: ${VITE_LOGOUT_KEYCLOAK_URL}
                - name: VITE_LOGOUT_KEYCLOAK_CLIENT_ID
                  value: ${VITE_LOGOUT_KEYCLOAK_CLIENT_ID}
                - name: VITE_BACKEND_URL
                  value: ${VITE_BACKEND_URL}
                - name: VITE_APP_NAME
                  value: ${VITE_APP_NAME}
                - name: VITE_ZONE
                  value: ${VITE_ZONE}
              volumeMounts:
                - name: srv
                  mountPath: /srv
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
                  ephemeral-storage: "200Mi"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 3001
                initialDelaySeconds: 5
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: 3001
                initialDelaySeconds: 3
                periodSeconds: 5
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: srv
              emptyDir: {}
            - name: tmp
              emptyDir: {}

  # ── Service ───────────────────────────────────────────────
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-frontend-${ZONE}
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000

  # ── Route ─────────────────────────────────────────────────
  # Deliberately NOT here. The frontend Route lives in its own template so it
  # can be applied per environment: openshift.route.yml (default cluster
  # hostname) for TEST and PR previews, openshift.vanity-route.yml
  # (frep.nrs.gov.bc.ca) for PROD only. `oc process` emits every object in a
  # template, so a Route defined here would be created in every environment —
  # which is exactly what we need to avoid to keep PROD on a single URL.
  # See the two route templates and the deploy steps in reusable-deploy.yml.

  # ── NetworkPolicy: ingress from OpenShift router ───────────
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-frontend-${ZONE}-ingress
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
