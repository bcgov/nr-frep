# General application
server:
  servlet:
    context-path: /
  error:
    include-message: always
  # Use the SERVER_PORT placeholder so application-local.yml's SERVER_PORT
  # value (and the OpenShift env var) can override the default. Local dev
  # needs 8080 because Vite's dev server claims 3000.
  port: ${SERVER_PORT:3000}
  shutdown: graceful
  max-http-request-header-size: 16KB
  # Connector-level request-body backstop, enforced by Undertow independently of Spring's multipart
  # limits. It sits ABOVE spring.servlet.multipart.max-request-size (below) so the multipart layer is
  # what normally rejects an oversized upload, with a field-level message; this only catches a body
  # that never reaches it. 50 MB, env-overridable.
  #
  # Deliberately NOT raised to the nr-fspts ~500 MB envelope. The binding constraint on upload size
  # is heap, not the connector: the ClamAV scan and the object-storage/BLOB write both need the whole
  # file as a byte[], and the JVM runs with -Xmx400m (backend/Dockerfile) under -XX:+ExitOnOutOfMemoryError,
  # so an oversized upload kills the pod rather than failing one request. nr-fspts configures 100 MB
  # per file on the same 200m heap, which is not actually reachable.
  undertow:
    max-http-post-size: ${MAX_HTTP_POST_SIZE:52428800}
  # Honor X-Forwarded-* from the Caddy reverse proxy when reconstructing the
  # request URL. Without this, Spring sees Host=frep-backend:8080 and the
  # browser-issued Origin=https://frep-a582fc-dev... is treated as cross-origin,
  # triggering a CORS allow-list check on every POST/PUT/DELETE.
  forward-headers-strategy: framework

spring:
  application:
    name: frep-backend
  # Attachment/photo uploads (multipart/form-data). 15 MB per file, uniform across Biodiversity
  # attachments and CHR photos; max-request-size leaves headroom for the metadata parts on a
  # single-file upload. Sized by heap, not by the connector or the virus scanner: the scan and the
  # storage write each need the whole file as a byte[] on a 400m heap (see the Undertow note above);
  # clamd's StreamMaxLength is 150M and ephemeral storage is 500Mi, so neither binds here.
  #
  # file-size-threshold is left at its 0 default so every part spools to a temp file under
  # java.io.tmpdir instead of buffering in memory — disk is the resource we have spare. That makes
  # the /tmp emptyDir mount in openshift.deploy.yml load-bearing: the container runs with
  # readOnlyRootFilesystem, so without it Spring cannot write the spool file at all.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:17MB}
  datasource:
    url: "jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=${DATABASE_HOST})(PORT=${DATABASE_PORT:1543}))(CONNECT_DATA=(SERVICE_NAME=${DATABASE_SERVICE_NAME})(SERVER=DEDICATED)))"
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Pin the decimal separator for every pooled connection.
      #
      # The legacy FREP_2xx packages declare every parameter VARCHAR2 and then hand the numeric ones
      # to setters that take a NUMBER — e.g. FREP_210_BIO_OPENING.SAVE's p_frep_wtp_override goes to
      # frep_biodiversity_checklist.set_frep_wtp_override(p_value IN NUMBER). That implicit
      # VARCHAR2 -> NUMBER conversion runs under the *session's* NLS_NUMERIC_CHARACTERS, which the
      # thin driver derives from the JVM's default locale unless it is set here. Where that decimal
      # separator is not ".", every scalar decimal the app sends fails with
      # "ORA-06502: PL/SQL: numeric or value error: character to number conversion error" while whole
      # numbers save cleanly — confirmed against the Opening's FREP gross area override and the
      # plot's fixed area radius. Stratum size, % windthrown, full count area and the rest of the
      # scalar decimals ride the same path.
      #
      # Not the same path as the plot sub-tables: their numbers are VARRAY object attributes, parsed
      # to BigDecimal in Java (AbstractFrepRepository#numberAttribute) and bound as real NUMBERs, so
      # DBH and height were never affected. Reads are unaffected either way — numberString goes
      # through BigDecimal#toPlainString.
      #
      # The value is decimal separator then group separator, so "." and "," — the ANSI default, and
      # what every caller here already assumes.
      connection-init-sql: "ALTER SESSION SET NLS_NUMERIC_CHARACTERS = '.,'"
      data-source-properties:
        javax.net.ssl.trustStoreType: JKS
        javax.net.ssl.trustStore: ${TRUSTSTORE_PATH:/cert/jssecacerts}
        javax.net.ssl.trustStorePassword: ${KEYSTORE_SECRET}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI}
          jwk-set-uri: ${AWS_COGNITO_ISSUER_URI}/.well-known/jwks.json
  mvc:
    problemdetails:
      enabled: true
  sleuth:
    propagation-keys:
      - X-TRACE-ID
      - X-USER
    baggage-keys:
      - X-TRACE-ID
      - X-USER
    log:
      slf4j:
        whitelisted-mdc-keys:
          - X-TRACE-ID
          - X-USER
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

# Actuator and ops
management:
  enable-native-support: true
  endpoints:
    web:
      exposure:
        # health + prometheus only: the probes and the Prometheus scrape. `info` was exposed but
        # nothing reads it — the `info.app.*` properties below are consumed by
        # FrepMetricConfiguration through @Value, not through the endpoint.
        include: "health,prometheus"
  endpoint:
    metrics:
      enabled: false
    health:
      # The liveness/readiness probes only check the status code (openshift.deploy.yml), so the
      # component and datasource detail was published to no one who needed it.
      show-details: never

# Application metadata. Read by FrepMetricConfiguration through @Value — not by the Actuator
# /info endpoint, which is no longer exposed. These keys must stay or startup fails.
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    zone: ${APP_ZONE:local}

frep:
  package-name: FREP
  codelist-package-name: FREP_CODE_LISTS
  # BC Gov DataBC public WFS, proxied for the in-app Leaflet map (opening polygon GeoJSON by
  # OPENING_ID). Public endpoint — overridable per environment but the default is production-correct.
  open-maps:
    url: ${OPENMAPS_URL:https://openmaps.gov.bc.ca/geo/ows}
  # Shared S3-compatible object storage — CHR photos and Biodiversity attachments (same bucket).
  object-storage:
    host: ${OBJECT_STORAGE_HOST}
    bucket: ${OBJECT_STORAGE_BUCKET}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
  # ClamAV virus scanning for uploaded attachment/photo bytes (clamd INSTREAM over raw TCP to a
  # shared in-cluster ClamAV service). Enabled by default in deployed envs; the local profile turns
  # it off (no clamd locally). fail-open=false = fail-CLOSED: reject uploads when the scanner can't
  # verify them. Requires a NetworkPolicy allowing egress to clamd on the tools namespace.
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
    fail-open: ${CLAMAV_FAIL_OPEN:false}
    connect-timeout: ${CLAMAV_CONNECT_TIMEOUT:5s}
    read-timeout: ${CLAMAV_READ_TIMEOUT:30s}
    chunk-size: 8192

  # ── ONE-TIME CUTOVER TOOLING — DELETE-AFTER-BIO-ATTACHMENT-MIGRATION ──────────────────────────
  # Grep that tag to find every file and method that must go; the checklist is in
  # backend/tools/bio-attachment-migration-runbook.md.
  # Biodiversity attachment BLOB → object-storage backfill. Off everywhere by default; the whole run
  # is driven by `oc set env` against the Deployment, so no rebuild is needed to start or stop it.
  # When `enabled` is false the scheduler bean and all scheduling infrastructure are absent entirely
  # (BioAttachmentMigrationConfiguration). Delete this block with the rest of the tooling once
  # Phase 4b has shipped. See backend/tools/bio-attachment-migration-runbook.md.
  bio-attachment-migration:
    enabled: ${BIO_ATTACHMENT_MIGRATION_ENABLED:false}
    # Defaults to a dry run: if the flag above is ever set without thinking, the result is a report,
    # not 5,000 writes to production object storage.
    dry-run: ${BIO_ATTACHMENT_MIGRATION_DRY_RUN:true}
    # Delay after context refresh before the single run starts — lets the Hikari pool and the
    # object-storage client settle, and leaves a window to abort by scaling the Deployment down.
    initial-delay: ${BIO_ATTACHMENT_MIGRATION_INITIAL_DELAY:60s}
    batch-size: ${BIO_ATTACHMENT_MIGRATION_BATCH_SIZE:250}
    verify-batch-size: ${BIO_ATTACHMENT_MIGRATION_VERIFY_BATCH_SIZE:500}

resilience4j:
  circuitbreaker:
    instances:
      breaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      apiRetry:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException



# Certificate for the Database
ca:
  bc:
    gov:
      nrs:
        self-uri: http://localhost:3000
        identity-lookup:
          base-url: ${IDENTITY_LOOKUP_BASE_URL:}
          default-page-size: 10
          connect-timeout: 15s
          read-timeout: 30s
        cognito:
          userinfo-uri: ${COGNITO_USERINFO_URI}
        frontend:
          url: http://localhost:3000
          cors:
            headers:
              - x-requested-with
              - X-REQUESTED-WITH
              - authorization
              - Authorization
              - Content-Type
              - content-type
              - credential
              - CREDENTIAL
              - X-XSRF-TOKEN
              - access-control-allow-origin
              - Access-Control-Allow-Origin
              - DNT
              - Keep-Alive,
              - User-Agent,
              - X-Requested-With,
              - If-Modified-Since,
              - Cache-Control,
              - Content-Range,
              - Range
              - Location
              - location
            methods:
              - OPTIONS
              - GET
              - POST
              - PUT
              - DELETE
            age: 5m

# Logging — Spring Boot default stack (SLF4j + Logback).
#
# Per-category levels default to INFO; override at runtime via env vars
# (Spring's relaxed binding maps UPPERCASE_WITH_UNDERSCORES → dot.case):
#   APP_LOG_LEVEL                              → ca.bc.gov.nrs.frep
#   HIKARI_LOG_LEVEL                           → com.zaxxer.hikari
#   ORACLE_JDBC_LOG_LEVEL                      → oracle.jdbc
#   LOGGING_LEVEL_ROOT                         → root logger
#   LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY → Spring Security
#
# Console pattern includes X-TRACE-ID and X-USER MDC keys populated by the
# request filter, plus PID and app name. To switch to structured JSON output
# (e.g. in containers), set the env var directly:
#   LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs   (Elastic Common Schema)
#   LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
# Setting it via relaxed binding lets Spring Boot 3.4+ install the right
# structured layout. Don't wire an empty-default placeholder here — Spring
# treats "" as "structured logging on, no format" and fails layout init.
logging:
  level:
    ca.bc.gov.nrs.frep: ${APP_LOG_LEVEL:INFO}
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:INFO}
    oracle.jdbc: ${ORACLE_JDBC_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name}] [%X{X-TRACE-ID:-},${PID:-}] [%t] %logger:%L - %m%n%wEx"
