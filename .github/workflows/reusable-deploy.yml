# Reusable Deploy
#
# Adapted from the BCGov quickstart-openshift template
# (https://github.com/bcgov/quickstart-openshift) to drop the Postgres
# database job — we use an external shared Oracle, not a per-PR DB.
#
# Each service Template (backend/frontend) is `oc process`-ed with parameters
# specific to that service. Splitting into named jobs (rather than a matrix
# with conditional params) keeps the wiring readable.
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment (e.g. dev, test, prod)
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, 'test' or 'prod'
        default: ${{ github.event.number }}
        type: string
      slot:
        description: |
          Route hostname slot — PR # mod-50'd into a fixed pool of pre-registered
          Cognito callback URIs (see pr-open.yml). Omit for TEST/PROD; defaults to
          `target` in that case so the host stays `nr-frep-{test,prod}.apps...`.
        default: ""
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      backend_replicas:
        description: |
          Backend pod count. Sets Deployment.spec.replicas AND both ends of the
          backend HPA (MIN_REPLICAS = MAX_REPLICAS), so the count is pinned
          rather than autoscaled — predictable against the namespace quota.
          Defaults to "1" so PR previews stay light; merge.yml sets "2" for
          TEST and "3" for PROD.
        default: "1"
        type: string
      frontend_replicas:
        description: |
          Frontend pod count. Defaults to "2" — the value hardcoded in
          frontend/openshift.deploy.yml before this was parameterized, so PR
          previews and TEST are unchanged. merge.yml sets "2" for TEST and "3"
          for PROD.
        default: "2"
        type: string
      triggers:
        description: Triggers for deployment (paths that must change)
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      database_user:
        description: Oracle DATABASE_USER
        required: true
      database_password:
        description: Oracle DATABASE_PASSWORD
        required: true
      database_host:
        description: Oracle host
        required: true
      database_service_name:
        description: Oracle service name
        required: true
      keystore_secret:
        description: Oracle keystore passphrase
        required: true
      object_storage_host:
        description: CHR object storage host
        required: true
      object_storage_bucket:
        description: CHR object storage bucket
        required: true
      object_storage_access_key:
        description: CHR object storage access key
        required: true
      object_storage_secret_key:
        description: CHR object storage secret key
        required: true
      clamav_host:
        description: |
          clamd host for the backend's CLAMAV_HOST (e.g.
          clamav.<tools-namespace>.svc.cluster.local). Required by the backend
          template — the deploy fails if it isn't provided.
        required: false
      vanity_tls_certificate:
        description: |
          PEM leaf/server certificate for the PROD vanity Route hostname
          (vars.VANITY_HOST). Applied only on PROD when VANITY_HOST is set.
        required: false
      vanity_tls_key:
        description: |
          PEM private key (unencrypted) matching vanity_tls_certificate.
        required: false
      vanity_tls_ca_certificate:
        description: |
          PEM CA chain for the vanity certificate: the Entrust intermediate
          followed by the Sectigo R46 cross-signing root. See the chain notes
          in frontend/openshift.vanity-route.yml.
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.frontend.outputs.triggered }}

permissions: {}

jobs:
  backend:
    name: Deploy (backend)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    # Plumb sensitive values through job-level env vars rather than expanding
    # `${{ secrets.* }}` directly inside the `parameters` string. The deployer
    # action ultimately runs:
    #   TEMPLATE="$(oc process ... ${{ inputs.parameters }} ...)"
    # which means GHA substitutes the literal secret into a bash double-quoted
    # context. Any `$X` inside the value (where X is an unset name) gets
    # variable-expanded by bash and silently dropped along with its leading
    # `$`. Going through env + `"$VAR"` means bash performs only a single
    # expansion to the literal value; characters inside that value are not
    # re-parsed for `$`/`'`/`"` semantics.
    env:
      DATABASE_PASSWORD: ${{ secrets.database_password }}
      KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
      OBJECT_STORAGE_HOST: ${{ secrets.object_storage_host }}
      OBJECT_STORAGE_BUCKET: ${{ secrets.object_storage_bucket }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.object_storage_access_key }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.object_storage_secret_key }}
      # CLAMAV_HOST is a secret; route it through env (not inline in
      # `parameters`) for a single bash expansion, same reasoning as
      # DATABASE_PASSWORD above.
      CLAMAV_HOST: ${{ secrets.clamav_host }}
    steps:
      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        with:
          file: backend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # debug: true is intentionally OFF. With debug on, the deployer
          # logs the processed Template (including K8s Secret stringData),
          # and GitHub's secret-masking misses values that contain JSON-
          # special characters (<, >, &, etc.) once they get re-encoded.
          # If you need to debug a deploy, enable this temporarily on a
          # commit that uses NON-sensitive placeholder values.
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="nr-frep"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p MIN_REPLICAS="${{ inputs.backend_replicas }}"
            -p MAX_REPLICAS="${{ inputs.backend_replicas }}"
            -p AWS_COGNITO_ISSUER_URI="${{ vars.AWS_COGNITO_ISSUER_URI }}"
            -p COGNITO_USERINFO_URI="${{ vars.COGNITO_USERINFO_URI }}"
            -p IDENTITY_LOOKUP_BASE_URL="${{ vars.IDENTITY_LOOKUP_BASE_URL }}"
            -p DATABASE_HOST="${{ secrets.database_host }}"
            -p DATABASE_SERVICE_NAME="${{ secrets.database_service_name }}"
            -p DATABASE_USER="${{ secrets.database_user }}"
            -p DATABASE_PASSWORD="$DATABASE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"
            -p OBJECT_STORAGE_HOST="$OBJECT_STORAGE_HOST"
            -p OBJECT_STORAGE_BUCKET="$OBJECT_STORAGE_BUCKET"
            -p OBJECT_STORAGE_ACCESS_KEY="$OBJECT_STORAGE_ACCESS_KEY"
            -p OBJECT_STORAGE_SECRET_KEY="$OBJECT_STORAGE_SECRET_KEY"
            -p CLAMAV_ENABLED="${{ vars.CLAMAV_ENABLED || 'true' }}"
            -p CLAMAV_HOST="$CLAMAV_HOST"
            -p CLAMAV_PORT="${{ vars.CLAMAV_PORT || '3310' }}"
            -p CLAMAV_FAIL_OPEN="${{ vars.CLAMAV_FAIL_OPEN || 'false' }}"
            -p ATTACHMENT_ALLOWED_TYPES="${{ vars.ATTACHMENT_ALLOWED_TYPES }}"
          triggers: ${{ inputs.triggers }}

  frontend:
    name: Deploy (frontend)
    environment: ${{ inputs.environment }}
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    # Job-level so the vanity step's `if:` can read it (a step's own `env` is
    # not available to that step's `if`). Environment-scoped var — set only on
    # the `prod` environment; empty everywhere else, which skips the step.
    env:
      VANITY_HOST: ${{ vars.VANITY_HOST }}
    steps:
      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # debug: true is intentionally OFF. With debug on, the deployer
          # logs the processed Template (including K8s Secret stringData),
          # and GitHub's secret-masking misses values that contain JSON-
          # special characters (<, >, &, etc.) once they get re-encoded.
          # If you need to debug a deploy, enable this temporarily on a
          # commit that uses NON-sensitive placeholder values.
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="nr-frep"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p REPLICAS="${{ inputs.frontend_replicas }}"
            -p VITE_USER_POOLS_ID="${{ vars.VITE_USER_POOLS_ID }}"
            -p VITE_USER_POOLS_WEB_CLIENT_ID="${{ vars.VITE_USER_POOLS_WEB_CLIENT_ID }}"
            -p VITE_LOGOUT_SITEMINDER_URL="${{ vars.VITE_LOGOUT_SITEMINDER_URL }}"
            -p VITE_LOGOUT_KEYCLOAK_URL="${{ vars.VITE_LOGOUT_KEYCLOAK_URL }}"
            -p VITE_LOGOUT_KEYCLOAK_CLIENT_ID="${{ vars.VITE_LOGOUT_KEYCLOAK_CLIENT_ID }}"
            -p VITE_BACKEND_URL="${{ vars.VITE_BACKEND_URL }}"
            -p VITE_SILVA_BASE_URL="${{ vars.VITE_SILVA_BASE_URL }}"
            -p VITE_ATTACHMENT_TYPES="${{ vars.ATTACHMENT_ALLOWED_TYPES }}"
            -p VITE_SUPPORT_EMAIL="${{ vars.SUPPORT_EMAIL }}"
            -p VITE_ZONE="${{ vars.VITE_ZONE }}"
          triggers: ${{ inputs.triggers }}

      # Default cluster-domain Route (nr-frep-<slot>.apps.gold...). Applied on
      # every environment EXCEPT prod — PROD is served ONLY by the vanity Route
      # below, so it gets no default route and has a single public URL. TEST and
      # PR previews have no custom hostname and need this. Its own template
      # because `oc process` can't skip an object per environment.
      - name: Default Route (non-PROD)
        if: ${{ inputs.target != 'prod' }}
        uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        with:
          file: frontend/openshift.route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p NAME="nr-frep"
            -p ZONE="${{ inputs.target }}"
            -p SLOT="${{ inputs.slot || inputs.target }}"
          triggers: ${{ inputs.triggers }}

      # PROD vanity Route (frep.nrs.gov.bc.ca). On PROD this is the ONLY public
      # Route — the default-route step above is skipped for prod.
      #
      # Runs only on PROD and only when the vanity host is configured
      # (VANITY_HOST unset -> skipped), so TEST and PR previews are unaffected.
      # The cert / key / chain are multiline PEM secrets: routed through env
      # and passed as "$VAR" (single bash expansion) so their newlines survive
      # — same reasoning as DATABASE_PASSWORD in the backend job above.
      - name: Vanity Route (PROD)
        if: ${{ inputs.target == 'prod' && env.VANITY_HOST != '' }}
        uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        env:
          VANITY_TLS_CERTIFICATE: ${{ secrets.vanity_tls_certificate }}
          VANITY_TLS_KEY: ${{ secrets.vanity_tls_key }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.vanity_tls_ca_certificate }}
        with:
          file: frontend/openshift.vanity-route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p NAME="nr-frep"
            -p ZONE="${{ inputs.target }}"
            -p VANITY_HOST="$VANITY_HOST"
            -p VANITY_TLS_CERTIFICATE="$VANITY_TLS_CERTIFICATE"
            -p VANITY_TLS_KEY="$VANITY_TLS_KEY"
            -p VANITY_TLS_CA_CERTIFICATE="$VANITY_TLS_CA_CERTIFICATE"
          triggers: ${{ inputs.triggers }}
